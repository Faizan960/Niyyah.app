# CI for Niyyah.app — Android app + Cloudflare backend.
#
# Runs on every PR targeting main and every push to main. Read-only with respect
# to infrastructure: no deployment commands, no production secrets.
#
# Jobs:
#   android             — unit tests + debug builds (JVM-only, fast)
#   android-instrumented— real emulator run of the instrumented tests, including
#                         the Room migration tests (8→9, 9→10, 10→11, 11→12).
#                         This is a TRUE device/emulator verification, distinct
#                         from the compile-only check in the android job.
#   backend             — Cloudflare Worker typecheck + tests against real local
#                         D1 (vitest + @cloudflare/vitest-plugin).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android — unit tests & builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The project pins a Java 17 toolchain (app/build.gradle.kts jvmToolchain(17)).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Ensures the Android SDK is present with licenses accepted so AGP can
      # auto-fetch missing platforms (compileSdk 36) if the runner image lacks them.
      - uses: android-actions/setup-android@v3

      # Caches the Gradle user home (wrapper dists + dependencies).
      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Debug build
        run: ./gradlew assembleDebug

      - name: Compile instrumented tests
        run: ./gradlew assembleDebugAndroidTest

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/test-results/testDebugUnitTest
          if-no-files-found: ignore

  android-instrumented:
    name: Android — instrumented tests (emulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      # Boots a real emulator (GitHub ubuntu runners expose KVM) and runs the
      # full connectedDebugAndroidTest suite — the only place the Room
      # Migration11to12Test is actually executed against a device.
      - name: Run instrumented tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          script: ./gradlew connectedDebugAndroidTest

  backend:
    name: Cloudflare backend — typecheck & tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - uses: actions/checkout@v4

      # No engines pin in package.json; Node 22 LTS matches local dev.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json

      - name: Install dependencies (lockfile)
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests (real Worker runtime + local D1)
        run: npm test -- --reporter=junit --outputFile=test-results.xml

      - name: Upload backend test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: cloudflare/test-results.xml
          if-no-files-found: ignore
