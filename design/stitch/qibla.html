<style>
        body {
            background-color: #F7F6F3;
            -webkit-tap-highlight-color: transparent;
        }
        
        .compass-dial {
            background: linear-gradient(145deg, #ffffff, #f4f3f0);
            border: 1px solid rgba(184, 142, 56, 0.2);
        }
        
        .gold-ring {
            background: conic-gradient(
                from 0deg,
                #b88e38, #eec064, #b88e38, #5d4200, #b88e38, #eec064, #b88e38
            );
            mask-image: radial-gradient(transparent 68%, black 70%);
            -webkit-mask-image: radial-gradient(transparent 68%, black 70%);
        }
        
        .tick-mark {
            position: absolute;
            width: 2px;
            height: 10px;
            background-color: #outline-variant;
            left: 50%;
            transform-origin: 50% 150px; /* Adjust based on compass size */
        }
        
        /* Generating ticks using CSS vars would be complex without JS or preprocessors, 
           so we'll simulate a clean minimal watch face with carefully placed elements */
           
        .compass-needle {
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        /* Hide scrollbar for clean app feel */
        ::-webkit-scrollbar {
            display: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="text-on-surface flex flex-col min-h-screen relative overflow-hidden font-body-md">
<!-- Top App Bar -->
<header class="bg-surface docked full-width top-0 flex justify-between items-center w-full px-safe-margin py-md z-40 relative">
<button class="text-on-surface-variant hover:opacity-80 transition-opacity">
<span class="material-symbols-outlined" data-icon="menu">menu</span>
</button>
<h1 class="font-display-md text-display-md text-primary">Niyyah</h1>
<button class="text-on-surface-variant hover:opacity-80 transition-opacity">
<span class="material-symbols-outlined" data-icon="notifications">notifications</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col items-center justify-center px-safe-margin pb-[100px] z-10 relative">
<!-- Header Section -->
<div class="text-center mb-2xl">
<h2 class="font-display-lg text-display-lg text-primary tracking-tight">Qibla</h2>
<p class="font-body-lg text-body-lg text-outline mt-sm">Find your direction</p>
</div>
<!-- Compass Container -->
<div class="relative w-[300px] h-[300px] rounded-full shadow-compass flex items-center justify-center">
<!-- The Gold Rim (Simulated with conic gradient mask) -->
<div class="absolute inset-0 rounded-full gold-ring opacity-80 pointer-events-none"></div>
<!-- Inner Dial -->
<div class="absolute inset-[4px] rounded-full compass-dial flex items-center justify-center shadow-inner">
<!-- Cardinal Points -->
<div class="absolute top-4 left-1/2 -translate-x-1/2 font-display-md text-primary opacity-80">N</div>
<div class="absolute bottom-4 left-1/2 -translate-x-1/2 font-label-sm text-outline opacity-50">S</div>
<div class="absolute right-4 top-1/2 -translate-y-1/2 font-label-sm text-outline opacity-50">E</div>
<div class="absolute left-4 top-1/2 -translate-y-1/2 font-label-sm text-outline opacity-50">W</div>
<!-- Subtle Decorative Elements (Swiss Minimalist) -->
<div class="absolute w-[80%] h-[80%] rounded-full border border-surface-variant opacity-50 pointer-events-none"></div>
<!-- Active Qibla Indicator (Kaaba) - Placed at ~45 degrees for demo -->
<div class="absolute w-full h-full pointer-events-none transform rotate-[65deg]">
<div class="absolute top-2 left-1/2 -translate-x-1/2 flex flex-col items-center">
<span class="material-symbols-outlined text-on-tertiary-container text-[24px]" style="font-variation-settings: 'FILL' 1;">mosque</span>
<!-- <div class="w-1.5 h-1.5 bg-on-tertiary-container rounded-full mt-1"></div> -->
</div>
</div>
<!-- Compass Needle -->
<div class="relative w-full h-full flex items-center justify-center pointer-events-none compass-needle" style="transform: rotate(20deg);">
<!-- North Pointer -->
<div class="absolute top-[20%] w-[4px] h-[30%] bg-primary rounded-t-full origin-bottom"></div>
<!-- South Pointer -->
<div class="absolute bottom-[20%] w-[2px] h-[30%] bg-outline-variant rounded-b-full origin-top"></div>
<!-- Center Pivot -->
<div class="absolute w-4 h-4 bg-surface rounded-full border-2 border-primary z-10 shadow-sm"></div>
<div class="absolute w-1 h-1 bg-on-tertiary-container rounded-full z-20"></div>
</div>
</div>
</div>
<!-- Coordinates/Location Data -->
<div class="mt-3xl flex flex-col items-center">
<div class="inline-flex items-center gap-2 px-4 py-2 bg-surface-container-lowest border border-surface-variant rounded-full shadow-sunlit">
<span class="material-symbols-outlined text-outline text-[18px]">location_on</span>
<span class="font-label-md text-label-md text-on-surface-variant">Mecca, SA</span>
</div>
<p class="font-label-sm text-label-sm text-outline mt-sm tracking-widest uppercase">Distance: 4,281 km</p>
</div>
</main>
<!-- Bottom Nav Bar (Mobile Only per guidelines, but forcing display for this specific screen request) -->

<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 1;">explore</span>

</a>

<span class="material-symbols-outlined mb-1">person</span>
<span class="font-label-sm text-label-sm">Profile</span>

<div class="fixed inset-0 pointer-events-none z-0 overflow-hidden">
<div class="absolute top-[-10%] left-[-10%] w-[50%] h-[50%] bg-surface-container rounded-full blur-3xl opacity-50"></div>
