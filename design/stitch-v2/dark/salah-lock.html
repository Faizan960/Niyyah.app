            font-family: 'Material Symbols Outlined';

            font-style: normal;
            font-size: 24px;
            display: inline-block;
            line-height: 1;
            text-transform: none;
            letter-spacing: normal;
            word-wrap: normal;
            white-space: nowrap;
            direction: ltr;
        }
        
        /* Shimmer loading effect for subtle background ambiance */
        @keyframes ambient-glow {
            0% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(1.05); }
            100% { opacity: 0.3; transform: scale(1); }
        }
        .bg-glow {
            animation: ambient-glow 8s ease-in-out infinite;
        }

        /* Number transition classes */
        .digit-enter {
            opacity: 0;
            transform: translateY(-10px);
        }
        .digit-enter-active {
            opacity: 1;
            transform: translateY(0);
            transition: opacity 300ms, transform 300ms cubic-bezier(0.2, 0, 0, 1);
        }
    </style>

<body class="bg-background text-on-surface font-body-md h-screen w-full overflow-hidden flex flex-col relative selection:bg-primary-container selection:text-on-primary-container">
<!-- Ambient Background Glow -->
<div class="absolute inset-0 pointer-events-none overflow-hidden z-0 flex items-center justify-center">
<div class="w-[300px] h-[300px] rounded-full bg-primary-container/5 blur-[100px] bg-glow"></div>
</div>
<!-- Mock Mobile Status Bar (Visual anchor for lock screen context) -->
<div class="w-full flex justify-between items-center px-lg py-sm z-10 opacity-70">
<span class="font-label-sm text-label-sm text-on-surface">12:30</span>
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-[16px]">signal_cellular_alt</span>
<span class="material-symbols-outlined text-[16px]">wifi</span>
<span class="material-symbols-outlined text-[16px]">battery_full</span>
</div>
</div>
<!-- Main Content Area: Focus Mode -->
<main class="flex-grow flex flex-col items-center justify-center z-10 px-lg -mt-xxl">
<!-- Focus Title -->
<div class="flex flex-col items-center mb-xl opacity-90 transition-all duration-700 ease-out translate-y-0" id="focus-header">
<span class="material-symbols-outlined text-primary-container text-[32px] mb-sm" style="font-variation-settings: 'FILL' 1;">mosque</span>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface tracking-wide">Dhuhr Focus</h1>
<p class="font-label-sm text-label-sm text-on-surface-variant mt-1 uppercase tracking-widest">Device Locked</p>
</div>
<!-- Countdown Timer -->
<div class="relative flex flex-col items-center justify-center mb-xxl">
<!-- Time Display -->
<div class="font-display-lg text-display-lg text-primary-container tracking-tighter flex items-baseline gap-1" style="font-size: 80px; line-height: 1;">
<span id="min-tens">0</span><span id="min-units">1</span>
<span class="opacity-50 mx-1">:</span>
<span id="sec-tens">2</span><span class="inline-block transition-transform duration-300" id="sec-units">4</span>
</div>
<p class="font-label-md text-label-md text-on-surface-variant mt-sm opacity-80">Remaining</p>
</div>
<!-- Restricted Apps (Permitted during focus) -->
<div class="flex flex-col items-center w-full max-w-sm mt-lg">
<div class="flex items-center justify-center gap-lg bg-surface-container-low/50 backdrop-blur-md rounded-full px-xl py-sm border border-outline-variant/30">

<span class="material-symbols-outlined text-on-surface">call</span>
</div>
</button>
<div class="w-px h-6 bg-outline-variant/50"></div>
<button class="flex flex-col items-center gap-1 opacity-70 hover:opacity-100 transition-opacity duration-150 group">
<div class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center group-hover:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined text-on-surface">auto_stories</span>
</div>
</button>
<div class="w-px h-6 bg-outline-variant/50"></div>
<button class="flex flex-col items-center gap-1 opacity-70 hover:opacity-100 transition-opacity duration-150 group">
<div class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center group-hover:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined text-on-surface">emergency</span>
</div>
</button>
</div>
<p class="font-label-sm text-label-sm text-on-surface-variant mt-sm opacity-60">Emergency &amp; Prayer Apps Only</p>
</div>
</main>
<!-- Bottom NFC Verification Area -->
<div class="z-20 w-full px-base pb-base">
<div class="bg-surface-container-low/80 backdrop-blur-xl border border-outline-variant/30 rounded-[32px] p-lg flex flex-col items-center justify-center relative overflow-hidden group">
<!-- Subtle highlight on top edge -->
<div class="absolute top-0 left-0 right-0 h-px bg-gradient-to-r from-transparent via-primary-container/30 to-transparent"></div>
<div class="w-16 h-16 rounded-full bg-surface-container-high flex items-center justify-center mb-sm relative">
<!-- Pulsing ring -->
<div class="absolute inset-0 rounded-full border-2 border-primary-container/20 animate-ping" style="animation-duration: 3s;"></div>
<span class="material-symbols-outlined text-primary-container text-[32px]" style="font-variation-settings: 'FILL' 1;">nfc</span>
</div>
<h2 class="font-body-lg text-body-lg text-on-surface mb-1">Verify to Unlock</h2>
<p class="font-label-sm text-label-sm text-on-surface-variant text-center max-w-[200px]">Tap your prayer mat NFC tag or Niya ring to exit focus mode early.</p>
</div>
</div>
<script>
        // Simple countdown logic to show "Smooth numerical digit transitions"
        let totalSeconds = 84; // 01:24
        const secUnitsSpan = document.getElementById('sec-units');
        const secTensSpan = document.getElementById('sec-tens');
        const minUnitsSpan = document.getElementById('min-units');

        function updateTimer() {
            if (totalSeconds <= 0) return;
            
            totalSeconds--;
            
            const minutes = Math.floor(totalSeconds / 60);
            const seconds = totalSeconds % 60;
            
            const mUnits = minutes % 10;
            const sTens = Math.floor(seconds / 10);
            const sUnits = seconds % 10;

            // Animate only the changing digits for smoothness (focusing on seconds unit for demo)
            if (secUnitsSpan.innerText !== sUnits.toString()) {
                secUnitsSpan.style.transform = 'translateY(10px)';
                secUnitsSpan.style.opacity = '0';
                
                setTimeout(() => {
                    secUnitsSpan.innerText = sUnits;
                    secUnitsSpan.style.transform = 'translateY(0)';
                    secUnitsSpan.style.opacity = '1';
                }, 150);
            }
            
            secTensSpan.innerText = sTens;
            minUnitsSpan.innerText = mUnits;
        }

        setInterval(updateTimer, 1000);

        // Entrance animation logic
        document.addEventListener('DOMContentLoaded', () => {
            const header = document.getElementById('focus-header');
            header.style.opacity = '0';
            header.style.transform = 'translateY(20px)';
            
            setTimeout(() => {
                header.style.opacity = '0.9';
                header.style.transform = 'translateY(0)';
            }, 100);
        });
    </script>
