<script>
        // Generate compass ticks for luxury watch look
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('compass-ticks');
            const totalTicks = 72; // Every 5 degrees
            
            for (let i = 0; i < totalTicks; i++) {
                const tick = document.createElement('div');
                tick.className = `tick-mark ${i % 18 === 0 ? 'major' : ''}`; // Major tick every 90 degrees
                tick.style.transform = `rotate(${i * 5}deg)`;
                
                // Adjust position based on tick height
                if(i % 18 === 0) {
                     tick.style.top = '4px';
                     tick.style.transformOrigin = '50% 146px';
                } else {
                     tick.style.top = '8px';
                     tick.style.transformOrigin = '50% 142px';
                }
               
                container.appendChild(tick);
            }

            // Simulate compass movement
            const needle = document.querySelector('.needle');
            let currentRotation = 45;

            setInterval(() => {
                // Random slight flutter
                const flutter = (Math.random() - 0.5) * 4;
                needle.style.transform = `rotate(${currentRotation + flutter}deg)`;
            }, 2000);
        });
    </script>
