<!-- Script for simple timer update logic (Visual only) -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const timerElement = document.querySelector('h1.tabular-nums');
            if (!timerElement) return;

            let seconds = 30;
            let minutes = 24;
            let hours = 1;

            setInterval(() => {
                seconds--;
                if (seconds < 0) {
                    seconds = 59;
                    minutes--;
                    if (minutes < 0) {
                        minutes = 59;
                        hours--;
                        if (hours < 0) {
                            hours = 0; minutes = 0; seconds = 0; // Stop at 0
                        }
                    }
                }

                const h = hours.toString().padStart(2, '0');
                const m = minutes.toString().padStart(2, '0');
                const s = seconds.toString().padStart(2, '0');

                timerElement.innerHTML = `${h}:${m}<span class="text-on-primary/50 text-4xl ml-1">:${s}</span>`;
            }, 1000);
        });
    </script>
