<script>
        // Simple script to simulate compass movement for presentation
        document.addEventListener('DOMContentLoaded', () => {
            const needle = document.getElementById('compass-needle');
            if (window.DeviceOrientationEvent) {
                window.addEventListener('deviceorientation', (event) => {
                    let alpha = event.webkitCompassHeading || Math.abs(event.alpha - 360);
                    if (alpha) {
                        needle.style.transform = `rotate(${-alpha}deg)`;
                    }
                });
            } else {
                // Fallback subtle animation if no sensor
                let angle = 0;
                setInterval(() => {
                    angle = Math.sin(Date.now() / 2000) * 15; // subtle sway
                    needle.style.transform = `rotate(${angle}deg)`;
                }, 50);
            }
        });
    </script>
